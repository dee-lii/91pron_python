<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPS Manager v3.1 - 全生命周期管理平台</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 初始化设置页 -->
  <div id="init-page" class="auth-page" style="display: none;">
    <div class="auth-card">
      <h2>🚀 初始化 VPS Manager</h2>
      <p style="color: var(--text-light); margin-bottom: 24px;">首次使用，请设置管理员账号</p>
      <form id="init-form" onsubmit="handleInit(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" id="init-username" class="form-input" placeholder="至少3个字符" required minlength="3">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="init-password" class="form-input" placeholder="至少6个字符" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" id="init-password-confirm" class="form-input" placeholder="再次输入密码" required>
        </div>
        <div id="init-error" class="auth-error"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">创建管理员账号</button>
      </form>
    </div>
  </div>

  <!-- 登录页 -->
  <div id="login-page" class="auth-page" style="display: none;">
    <div class="auth-card">
      <h2>🔐 登录管理后台</h2>
      <p style="color: var(--text-light); margin-bottom: 24px;">请输入管理员账号密码</p>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" id="login-username" class="form-input" placeholder="用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="login-password" class="form-input" placeholder="密码" required>
        </div>
        <div id="login-error" class="auth-error"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
      </form>
      <div style="text-align: center; margin-top: 16px;">
        <a href="#/" style="color: var(--primary-from);">← 返回公开页</a>
      </div>
    </div>
  </div>

  <!-- 公开展示页 -->
  <div id="public-page" style="display: none;">
    <div class="container">
      <header class="header">
        <h1>VPS Manager</h1>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="goToLogin()">🔐 管理登录</button>
        </div>
      </header>

      <div class="card">
        <div class="card-title">📊 服务器状态概览</div>
        <div class="stats-grid" id="public-stats">
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">服务器总数</div></div>
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">在线</div></div>
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">离线</div></div>
          <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">即将到期</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🖥️ 服务器列表</div>
        <div id="public-server-list" class="vps-grid"></div>
      </div>

      <div class="card">
        <div class="card-title">🏆 性价比排行</div>
        <div id="public-rankings"></div>
      </div>
    </div>
  </div>

  <!-- 管理后台 -->
  <div id="admin-page" style="display: none;">
  <div class="container">
    <!-- 顶部导航 -->
    <header class="header">
      <h1>VPS Manager v3.1</h1>
      <div class="header-actions">
        <div class="user-info">
          <span id="current-user"></span>
          <button class="btn btn-secondary" onclick="handleLogout()">退出登录</button>
        </div>
        <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
        <button class="btn btn-secondary" onclick="importData()">📥 导入数据</button>
        <button class="btn btn-primary" onclick="openAddVpsModal()">➕ 添加 VPS</button>
      </div>
    </header>

    <!-- 标签页导航 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('management')">📊 批量管理</button>
      <button class="tab-btn" onclick="switchTab('ranking')">🏆 性价比排行</button>
      <button class="tab-btn" onclick="switchTab('nezha')">🔗 哪吒集成</button>
      <button class="tab-btn" onclick="switchTab('decision')">🤔 续费决策</button>
      <button class="tab-btn" onclick="switchTab('settings')">⚙️ 设置</button>
    </div>

    <!-- 批量管理面板 -->
    <div id="management" class="tab-content active">
      <div class="card">
        <div class="card-title">VPS 列表</div>

        <div class="sort-controls">
          <span class="sort-label">排序方式：</span>
          <button class="btn btn-secondary" onclick="sortVps('remainingValue')">剩余价值</button>
          <button class="btn btn-secondary" onclick="sortVps('usageRate')">使用率</button>
          <button class="btn btn-secondary" onclick="sortVps('purchaseDate')">购买日期</button>
          <button class="btn btn-secondary" onclick="sortVps('provider')">服务商</button>
        </div>

        <div id="vps-list" class="vps-grid"></div>
      </div>

      <!-- 趋势可视化 -->
      <div class="card">
        <div class="card-title">价值趋势可视化</div>
        
        <div class="form-group">
          <label class="form-label">选择 VPS 查看价值衰减趋势</label>
          <select id="trend-vps-select" class="form-select" onchange="updateTrendChart()">
            <option value="">请选择一个 VPS</option>
          </select>
        </div>

        <div class="chart-container" style="height: 300px;">
          <canvas id="lineChart"></canvas>
        </div>
      </div>

      <!-- 统计概览 -->
      <div class="card">
        <div class="card-title">统计概览</div>
        <div class="stats-grid" id="stats-overview"></div>
        <div class="charts-grid" style="margin-top: 20px;">
          <div class="chart-container" style="height: 250px;">
            <canvas id="pieChart"></canvas>
          </div>
          <div class="chart-container" style="height: 250px;">
            <canvas id="barChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 性价比排行榜 -->
    <div id="ranking" class="tab-content">
      <div class="card">
        <div class="card-title">性价比排行榜</div>

        <div class="form-group">
          <label class="form-label">排序维度</label>
          <div class="sort-controls">
            <button class="btn btn-primary" onclick="loadRankings('overall')">综合性价比</button>
            <button class="btn btn-secondary" onclick="loadRankings('cpu')">CPU 性价比</button>
            <button class="btn btn-secondary" onclick="loadRankings('memory')">内存性价比</button>
            <button class="btn btn-secondary" onclick="loadRankings('storage')">存储性价比</button>
            <button class="btn btn-secondary" onclick="loadRankings('network')">网络性价比</button>
          </div>
        </div>

        <div id="ranking-list"></div>
      </div>

      <div class="card">
        <div class="card-title">性价比统计报告</div>
        <div id="ranking-report"></div>
      </div>
    </div>

    <!-- 哪吒集成设置 -->
    <div id="nezha" class="tab-content">
      <div class="card">
        <div class="card-title">哪吒探针配置</div>

        <div class="form-group">
          <label class="form-label">API 地址 *</label>
          <input type="text" id="nezha-api-url" class="form-input" placeholder="例如：https://nezha.example.com">
        </div>

        <div class="form-group">
          <label class="form-label">Bearer Token *</label>
          <input type="password" id="nezha-token" class="form-input" placeholder="输入您的 API Token">
        </div>

        <div class="form-group">
          <label class="form-label">
            <input type="checkbox" id="nezha-auto-sync" style="margin-right: 8px;">
            启用自动同步（每小时）
          </label>
        </div>

        <div class="form-row">
          <button class="btn btn-secondary" onclick="testNezhaConnection()">🔍 测试连接</button>
          <button class="btn btn-primary" onclick="saveNezhaConfig()">💾 保存配置</button>
        </div>

        <div id="nezha-test-result" style="margin-top: 20px;"></div>
      </div>

      <div class="card">
        <div class="card-title">服务器列表同步</div>

        <button class="btn btn-primary" onclick="syncNezhaServers()" style="width: 100%;">🔄 立即同步服务器</button>

        <div id="nezha-sync-result" style="margin-top: 20px;"></div>
      </div>
    </div>

    <!-- 续费决策助手 -->
    <div id="decision" class="tab-content">
      <div class="card">
        <div class="card-title">续费决策助手</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">当前价格</label>
            <input type="number" id="current-price" class="form-input" placeholder="例如：100">
          </div>
          <div class="form-group">
            <label class="form-label">当前货币</label>
            <select id="current-currency" class="form-select">
              <option value="CNY">CNY (人民币)</option>
              <option value="USD">USD (美元)</option>
              <option value="EUR">EUR (欧元)</option>
              <option value="GBP">GBP (英镑)</option>
              <option value="JPY">JPY (日元)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">当前周期</label>
            <select id="current-cycle" class="form-select">
              <option value="monthly">月付</option>
              <option value="yearly">年付</option>
              <option value="biennial">两年付</option>
              <option value="triennial">三年付</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">购买日期</label>
            <input type="date" id="current-purchase-date" class="form-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">续费价格</label>
            <input type="number" id="renewal-price" class="form-input" placeholder="例如：120">
          </div>
          <div class="form-group">
            <label class="form-label">续费货币</label>
            <select id="renewal-currency" class="form-select">
              <option value="CNY">CNY (人民币)</option>
              <option value="USD">USD (美元)</option>
              <option value="EUR">EUR (欧元)</option>
              <option value="GBP">GBP (英镑)</option>
              <option value="JPY">JPY (日元)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">续费周期</label>
            <select id="renewal-cycle" class="form-select">
              <option value="monthly">月付</option>
              <option value="yearly">年付</option>
              <option value="biennial">两年付</option>
              <option value="triennial">三年付</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">折扣码（可选）</label>
            <input type="text" id="discount-code" class="form-input" placeholder="例如：SAVE20">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">折扣百分比（%）</label>
          <input type="number" id="discount-percent" class="form-input" placeholder="例如：20" min="0" max="100">
        </div>

        <button class="btn btn-primary" onclick="calculateDecision()" style="width: 100%;">计算决策</button>

        <div id="decision-result"></div>
      </div>
    </div>
  </div>

    <div id="settings" class="tab-content">
      <div class="card">
        <div class="card-title">🔐 修改密码</div>
        
        <form onsubmit="handleChangePassword(event)">
          <div class="form-group">
            <label class="form-label">当前密码</label>
            <input type="password" id="old-password" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">新密码</label>
            <input type="password" id="new-password" class="form-input" placeholder="至少6个字符" required minlength="6">
          </div>
          
          <div class="form-group">
            <label class="form-label">确认新密码</label>
            <input type="password" id="new-password-confirm" class="form-input" required>
          </div>
          
          <div id="password-error" class="auth-error"></div>
          <div id="password-success" style="color: var(--success); margin-bottom: 16px;"></div>
          
          <button type="submit" class="btn btn-primary">修改密码</button>
        </form>
      </div>
    </div>

  <!-- 添加/编辑 VPS 模态框 -->
  <div id="vps-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">添加 VPS</h2>
        <button class="modal-close" onclick="closeVpsModal()">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">VPS 名称 *</label>
        <input type="text" id="vps-name" class="form-input" placeholder="例如：阿里云香港 1C2G">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">服务商 *</label>
          <input type="text" id="vps-provider" class="form-input" placeholder="例如：阿里云">
        </div>
        <div class="form-group">
          <label class="form-label">购买日期 *</label>
          <input type="date" id="vps-purchase-date" class="form-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">价格 *</label>
          <input type="number" id="vps-price" class="form-input" placeholder="例如：100">
        </div>
        <div class="form-group">
          <label class="form-label">货币 *</label>
          <select id="vps-currency" class="form-select">
            <option value="CNY">CNY (人民币)</option>
            <option value="USD">USD (美元)</option>
            <option value="EUR">EUR (欧元)</option>
            <option value="GBP">GBP (英镑)</option>
            <option value="JPY">JPY (日元)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">付款周期 *</label>
        <select id="vps-cycle" class="form-select">
          <option value="monthly">月付</option>
          <option value="yearly">年付</option>
          <option value="biennial">两年付</option>
          <option value="triennial">三年付</option>
        </select>
      </div>

      <!-- 硬件配置（可选） -->
      <div class="card-title" style="margin-top: 24px; margin-bottom: 16px; font-size: 16px;">硬件配置（可选）</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">CPU 型号</label>
          <input type="text" id="vps-cpu-model" class="form-input" placeholder="例如：AMD EPYC 7542" list="cpu-models-list">
          <datalist id="cpu-models-list"></datalist>
        </div>
        <div class="form-group">
          <label class="form-label">CPU 核心数</label>
          <input type="number" id="vps-cpu-cores" class="form-input" placeholder="例如：4" min="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">内存大小 (GB)</label>
          <input type="number" id="vps-memory-size" class="form-input" placeholder="例如：8" min="0.5" step="0.5">
        </div>
        <div class="form-group">
          <label class="form-label">内存类型</label>
          <select id="vps-memory-type" class="form-select">
            <option value="">请选择</option>
            <option value="DDR4">DDR4</option>
            <option value="DDR5">DDR5</option>
            <option value="DDR3">DDR3</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">存储大小 (GB)</label>
          <input type="number" id="vps-storage-size" class="form-input" placeholder="例如：160" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">存储类型</label>
          <select id="vps-storage-type" class="form-select">
            <option value="">请选择</option>
            <option value="NVMe SSD">NVMe SSD</option>
            <option value="SSD">SSD</option>
            <option value="HDD">HDD</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">带宽 (Mbps)</label>
          <input type="number" id="vps-network-bandwidth" class="form-input" placeholder="例如：1000" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">月流量 (GB)</label>
          <input type="number" id="vps-network-traffic" class="form-input" placeholder="例如：20000" min="0">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">备注</label>
        <textarea id="vps-notes" class="form-textarea" placeholder="记录一些额外信息..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeVpsModal()">取消</button>
        <button class="btn btn-primary" onclick="saveVps()">保存</button>
      </div>
    </div>
  </div>

  <!-- 导入数据模态框 -->
  <div id="import-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">导入数据</h2>
        <button class="modal-close" onclick="closeImportModal()">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">选择 JSON 文件</label>
        <input type="file" id="import-file" class="form-input" accept=".json">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeImportModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmImport()">确认导入</button>
      </div>
    </div>
  </div>
  </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
